<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 30px; line-height: 1.6; }
      h1 { color: #333; }
      button { padding: 12px 24px; margin: 10px 10px 10px 0; cursor: pointer; border-radius: 4px; font-size: 16px; border: none; }
      .btn-download { background-color: #4CAF50; color: white; }
      .btn-clear { background-color: #f44336; color: white; }
    </style>
  </head>
  <body>
    <h1>データ管理パネル</h1>
    <button class="btn-download" onclick="downloadCsv()">データをCSVダウンロード</button>
    <button class="btn-clear" onclick="clearData()">全データ削除</button>

    <script>
      function downloadCsv() {
        // ボタンを押すとCSV生成関数を呼び出す
        google.script.run.withSuccessHandler(csv => {
          // BOMを付与してUTF-8でダウンロード（Excelでの文字化け防止）
          const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type: 'text/csv'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'data_export.csv';
          a.click();
        }).getSheetDataAsCsv();
      }

      function clearData() {
        // パスワード入力ダイアログを表示
        const password = prompt('データを削除するにはパスワードを入力してください：');
        
        // キャンセルされた場合
        if (password === null) {
          return;
        }
        
        // パスワードのチェック（仮パスワード: 1234）
        if (password !== '1234') {
          alert('パスワードが間違っています。');
          return;
        }

        // 確認メッセージ
        if (confirm('本当に全てのデータを削除しますか？\nこの操作は元に戻せません。')) {
          google.script.run.withSuccessHandler(() => alert('削除が完了しました')).clearData();
        }
      }
    </script>
  </body>
</html>
