<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; font-size: 16px; }
    </style>
</head>
<body>
    <h1>管理メニュー</h1>
    <button onclick="downloadCsv()" style="background-color: #27ae60;">全データダウンロード(CSV)</button>
    <button onclick="clearData()" style="background-color: #c0392b;">全データ削除</button>

    <script>
        // ★GASのウェブアプリURLを入力してください
        const WEB_APP_URL = "YOUR_WEB_APP_URL_HERE";

        async function downloadCsv() {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({action: "download"})
            });
            const csv = await response.text();
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], {type: 'text/csv;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = "data_list.csv";
            link.click();
        }

        async function clearData() {
            const password = prompt("パスワードを入力してください");
            if (!password) return;
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({action: "clear", password: password})
            });
            const result = await response.json();
            alert(result.message);
        }
    </script>
</body>
</html>
